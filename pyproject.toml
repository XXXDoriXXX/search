[project]
name = "pte"
version = "0.1.0"
description = "Product Truth Engine: resolve a product name into an evidenced, conflict-resolved JSON document"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "selectolax>=0.3",
  "pdfplumber>=0.11",
  "rapidfuzz>=3.6",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "fpdf2>=2.7"]

[project.scripts]
pte = "pte.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
